<!DOCTYPE html>
<!--
  SNS で共有したときの画像（OGP）の元データ。Web サイトの最初の画面と同じ見た目にしている
  書き出し（1200×630 の ogp.png を作る。Web フォントを読み込むので少し待つ）:
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
      --window-size=1200,630 --virtual-time-budget=5000 \
      --screenshot=docs/assets/images/ogp.png docs/assets/ogp/ogp.html
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?display=swap&family=Manrope:wght@300;400&family=Roboto:wght@300;400" rel="stylesheet">
<style>
  /* Web サイト（assets/main.css）と同じ色 */
  :root {
    --background: #F2F2FA;
    --title: #4C4C61;
    --text: #A19FB3;
    --accent: #597EFC;
    --accent-soft: rgba(89, 126, 252, 0.102);
    --purple: #815CFF;
    --button: #494D52;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: var(--background);
    font-family: 'Roboto', "Hiragino Sans", sans-serif;
    font-weight: 300;
    position: relative;
  }

  /* 中央: Web サイトの最初の画面と同じ構成 */
  .hero {
    position: absolute; left: 0; right: 0; top: 66px;
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }
  .kicker {
    color: var(--accent); font-family: 'Manrope', "Hiragino Sans", sans-serif; font-weight: 400;
    font-size: 21px; letter-spacing: 0.32em;
  }
  .logo { margin-top: 26px; width: 120px; height: 120px; } /* 角丸と影は画像に含まれている */
  .title {
    margin-top: 18px; color: var(--title);
    font-family: 'Manrope', sans-serif; font-weight: 300; font-size: 92px; letter-spacing: 0.02em; line-height: 1.1;
  }
  .lead {
    margin-top: 22px; color: var(--text);
    font-family: "Hiragino Sans", sans-serif; font-weight: 300; font-size: 25px; letter-spacing: 0.06em; line-height: 1.7;
  }
  .pills { margin-top: 26px; display: flex; gap: 14px; }
  .pill {
    font-family: "Hiragino Sans", sans-serif; font-weight: 400; font-size: 21px;
    padding: 12px 30px; border-radius: 999px;
  }
  .pill.soft { background: var(--accent-soft); color: var(--accent); }
  .pill.dark { background: var(--button); color: #fff; }

  /* まわり: 画面に流れるコメント（アプリと同じ縁取り文字）とリアクション */
  .comment {
    position: absolute; white-space: nowrap; color: #fff;
    font-family: "Hiragino Sans", sans-serif; font-weight: 800;
    -webkit-text-stroke: 6px var(--c); paint-order: stroke fill;
  }
  .reaction {
    position: absolute; width: 70px; height: 70px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 36px;
    background: #fff; box-shadow: 0 6px 18px rgba(76, 76, 97, 0.12);
  }
  .note { position: absolute; color: var(--accent); font-size: 30px; font-family: "Hiragino Sans", sans-serif; font-weight: 600; }
</style>
</head>
<body>
  <div class="comment" style="--c: var(--accent); left: 60px; top: 116px; font-size: 38px;">なるほど！</div>
  <div class="comment" style="--c: var(--purple); left: 900px; top: 126px; font-size: 34px;">わかりやすい👏</div>
  <div class="comment" style="--c: var(--title); left: 70px; top: 470px; font-size: 32px;">質問です🙋</div>
  <div class="comment" style="--c: var(--accent); left: 1010px; top: 470px; font-size: 32px;">www</div>

  <div class="reaction" style="left: 116px; top: 226px;">👏</div>
  <div class="reaction" style="left: 62px; top: 330px; width: 60px; height: 60px; font-size: 30px;">👍</div>
  <div class="reaction" style="left: 1030px; top: 226px;">🎉</div>
  <div class="reaction" style="left: 1080px; top: 326px; width: 60px; height: 60px; font-size: 30px;">📸</div>
  <div class="note" style="left: 194px; top: 210px;">♪</div>
  <div class="note" style="left: 996px; top: 306px; font-size: 24px;">♫</div>

  <div class="hero">
    <div class="kicker">音を鳴らせるコメント共有アプリケーション</div>
    <img class="logo" src="../images/image03.png" alt="">
    <div class="title">Commentable</div>
    <div class="lead">スマホから送ったコメントやリアクションが<br>発表者の画面に流れて、音が鳴る。</div>
    <div class="pills">
      <div class="pill soft">授業・学会・イベントに</div>
      <div class="pill dark">無料で使えます</div>
    </div>
  </div>
</body>
</html>

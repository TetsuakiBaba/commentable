<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <title>Commentable-Viewer</title>
    <meta charset="utf-8">
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        #canvas_placeholder {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }


        .QR_top_right {
            position: absolute;
            right: 20px;
            top: 20px;
            animation: fadeIn 2.0s ease 0.0s 1 normal;
            z-index: 9999;
            /* メニューの前面に配置 */
            transition: opacity 0.2s ease;
        }

        .QR_top_right * {
            pointer-events: none;
            /* 子要素のマウスイベントを無効化 */
        }

        .QR_top_right:hover {
            opacity: 0 !important;
            /* マウスホバー時に非表示 */
        }

        .QR_center {
            position: absolute;
            left: 50%;
            top: 50%;
            margin-top: -16%;
            margin-left: -16%;
            animation: fadeIn 2.0s ease 0.0s 1 normal;
            z-index: 9999;
            /* メニューの前面に配置 */
            transition: opacity 0.2s ease;
        }

        .QR_center * {
            pointer-events: none;
            /* 子要素のマウスイベントを無効化 */
        }

        .QR_center:hover {
            opacity: 0 !important;
            /* マウスホバー時に非表示 */
        }



        @keyframes rotation {
            0% {
                transform: scale(1.0);
            }

            10% {
                transform: scale(1.1)
            }

            100% {
                transform: scale(1.0)
            }
        }

        @keyframes fadeIn {

            /*animation-nameで設定した値を書く*/
            0% {
                opacity: 0
            }

            /*アニメーション開始時は不透明度0%*/

            100% {
                opacity: 1
            }

            /*アニメーション終了時は不透明度100%*/

        }

        @keyframes fadeOut {

            /*animation-nameで設定した値を書く*/
            0% {
                opacity: 0
            }

            /*アニメーション開始時は不透明度0%*/

            100% {
                opacity: 1
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(100px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeOutDown {
            from {
                opacity: 1;
                transform: translateY(0);
            }

            to {
                opacity: 0;
                transform: translateY(200px);
            }
        }

        .notification_in {
            opacity: 0;
            /* 初期状態で不透明度を0に設定 */
            animation: fadeInUp 1s ease forwards;
        }

        .notification_out {
            animation: fadeOutDown 1s ease forwards;
        }
    </style>
</head>

<body style="background-color:transparent;">
    <div id="p5_loading">
    </div>

    <div id="canvas_placeholder" class="position-relative">
        <span id="notification"
            class="position-absolute top-50 start-50 translate-middle badge rounded bg-success fs-1 notification_out">
            <span class="visually-hidden">unread messages</span>
        </span>
    </div>


    <div id="QR_center" class="QR_center"></div>
    <div id="QR_top_right" class="QR_top_right"></div>

    <script src="p5.min.js"></script>
    <script src="p5.sound.js"></script>
    <script src="p5.speech.js"></script>
    <!-- socket.io クライアントは同梱（サーバーより先に起動しても、サーバーが立ち上がれば自動で再接続される） -->
    <script src="socket.io.min.js"></script>
    <script>
        // 接続先・部屋名・バージョンは main.js から URL のクエリで渡される
        const launchParams = new URLSearchParams(window.location.search);
        window.SOCKET_SERVER_URL = launchParams.get('server') || 'https://commentable.onrender.com';
        window.ROOM_NAME = launchParams.get('room');
        window.APP_VERSION = launchParams.get('v') || 'undefined';
    </script>
    <script src="qr-code-styling.js"></script>

    <script src="utils.js"></script>
    <script src="sketch.js"></script>


</body>

</html>
